# Fixture ROUGE WF-5 : publication PyPI par un jeton stocké en secret, dans un
# job sans id-token: write, alors que GitHub documente la publication par OIDC
# pour cette action (id-token: write, username et password omis).
name: publication par secret long
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567
      - name: Publication avec un jeton durable
        uses: pypa/gh-action-pypi-publish@fedcba9876543210fedcba9876543210fedcba98
        with:
          password: ${{ secrets.JETON_PYPI }}
